; PlatformIO Project Configuration File
; Custom ESP32 DevKit (plain ESP32-WROOM-32, 4MB flash) with:
;   - 1.8" ST7735 SPI TFT (128x160)
;   - microSD card on the back of the TFT (shares the TFT's SPI bus)
;   - RC522 RFID reader (shares the TFT's SPI bus)
;   - PCF8574T I2C I/O expander driving 6 tactile buttons
;   - RDA5807M FM radio chip (shares the I2C bus with the PCF8574T)
;   - IR transmitter (2N2222 driven LED) + TSOP1838 IR receiver
;   - WS2812B single RGB LED
;   - Passive buzzer
;   - Battery voltage divider on an ADC pin
;
; No microphone on this build -- GPIO27/26 (originally wired for a PCM1808)
; are left free for future use; GPIO36 (also originally PCM1808) is now used
; as the FM-audio ADC input for the Bluetooth A2DP path (HAS_BT_AUDIO).
;
; See connections.md in this folder for the full pinout and the assumptions
; this config makes (I2C addresses, divider ratio, panel tab variant) that
; you should double check against your actual hardware.

[env:esp32-devkit-custom]
board = esp32
board_build.partitions = custom_4Mb_fullv2.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-devkit-custom>
build_flags =
	${env.build_flags}
	-Iboards/esp32-devkit-custom

	; ==================== Framework Control Flags ====================
	-DCORE_DEBUG_LEVEL=0  ; keep the binary small on 4MB flash
	-DCONFIG_ESP32_JTAG_SUPPORT_DISABLE=1

	; ==================== Feature gates ====================
	-DHAS_RGB_LED=1        ; WS2812B on GPIO17
	-DHAS_RTC=1            ; DS3231 on the shared sys_i2c bus
	-DHAS_RTC_DS3231=1     ; custom driver, see lib/RTC/ds3231_RTC.{h,cpp}
	-DRTC_SDA=33           ; matches sys_i2c -- see interface.cpp
	-DRTC_SCL=15
	; NOTE: this board's buttons sit behind a PCF8574T I2C expander, not raw
	; GPIOs, so the shared button HAL (hal_buttons_poll_6) cannot read them.
	; HAS_6_BUTTONS is still set so the rest of the UI (on-screen keyboard
	; layout, etc.) assumes a 6-button device; InputHandler() in
	; interface.cpp polls the PCF8574T by hand instead of calling
	; hal_buttons_init()/hal_buttons_poll_6().
	-DHAS_6_BUTTONS=1
	-DHAS_FM_RADIO=1       ; RDA5807M on the sys_i2c bus -- see src/modules/others/fm_radio.cpp

	; HAS_BT_AUDIO: classic-Bluetooth (BR/EDR) A2DP SOURCE -- Blackbird
	; connects itself OUT to a Bluetooth speaker/headset and streams FM
	; Radio / Play Music audio to it from its own menu. Built directly on
	; the ESP-IDF classic-BT headers bundled in the arduino-esp32 core (no
	; new lib_deps needed). *** THIS IS THE SINGLE RISKIEST FLAG IN THIS
	; BUILD. *** A plain ESP32 has one radio and ~520KB RAM shared between
	; WiFi, classic BT, and the BLE features Bruce already uses elsewhere --
	; running all three is memory/stability-tight and UNTESTED on real
	; hardware. If you hit boot crashes or brownout resets after enabling
	; this, the likely cause is RAM exhaustion from running all three radios
	; at once; the fallback is a standalone Bluetooth audio transmitter
	; module wired to the RDA5807M's analog output instead (ask if you want
	; that swapped in). See src/modules/others/bt_audio_source.h for the
	; full rundown.
	-DHAS_BT_AUDIO=1
	; GPIO36 = ADC1_CH0, the one remaining free ADC1-capable pin (ADC2 pins
	; can't be read while WiFi is active) -- this is the FM audio capture
	; input for the Bluetooth path. See connections.md for the mixer/bias
	; circuit that feeds it.
	-DFM_AUDIO_ADC_PIN=36

	; ==================== Library Flags (display) ====================
	-D USE_TFT_ESPI=1
	-DUSER_SETUP_LOADED=1
	-DST7735_DRIVER=1
	; Most of the common cheap "1.8 inch SPI 128x160" red-PCB modules use the
	; BLACKTAB init sequence. If colors look wrong (inverted, wrong tint, or
	; a visible offset/tearing band on one edge), try GREENTAB, GREENTAB2,
	; GREENTAB3 or REDTAB instead -- this varies by manufacturing batch and
	; there is no way to tell from the pinout alone.
	-DST7735_BLACKTAB=1
	-DTFT_RGB_ORDER=TFT_BGR
	-DTFT_WIDTH=128
	-DTFT_HEIGHT=160
	-DTFT_CS=5
	-DTFT_DC=21
	-DTFT_RST=4
	-DTFT_BL=22
	-DTFT_BACKLIGHT_ON=HIGH
	-DTFT_SCLK=18
	-DTFT_MOSI=23
	-DTFT_MISO=39
	-DTOUCH_CS=-1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=27000000
	-DSPI_READ_FREQUENCY=16000000

	; ==================== Environment Flags ====================
	-DDEVICE_NAME='"ESP32 Custom"'
	-DBTN_ALIAS='"Sel"'
	-DROTATION=0

	; -- RGB LED --
	-DRGB_LED=17
	-DLED_TYPE=WS2812B
	-DLED_ORDER=GRB
	-DLED_COUNT=1
	-DLED_COLOR_STEP=5

	; -- Infrared -- curated menu choice list; only the one real pin on this board
	-DIR_TX_PINS='{{"IR LED", 16}}'
	-DIR_RX_PINS='{{"TSOP1838", 35}}'

	; -- Battery (resistor divider into GPIO34) --
	; ASSUMPTION: equal-value divider (multiplier 2.0). If your two resistors
	; aren't equal, recompute: multiplier = (R1+R2)/R2 where R1 is the top
	; resistor (battery+ side) and R2 is the bottom resistor (to GND).
	-D ANALOG_BAT_PIN=34
	-D ANALOG_BAT_MULTIPLIER=2.0f

lib_deps =
	${env.lib_deps}
